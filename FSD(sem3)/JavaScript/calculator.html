<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Calculator</h1>
  <input placeholder = "enter numbers" class="js-calc" onkeydown="calc(event);">
  <button onclick="calculateTotal()">Calculate</button>
  <p class="js-total"></p>
<script>
  function calc(event){
    if (event.key ==='Enter'){
      calculateTotal();
    }
  }
  function calculateTotal(){
      const inputElement = document.querySelector('.js-calc');

        let total= (inputElement.value); 

        document.querySelector('.js-total')
          .innerHTML = `${total}`;
  }
</script>
</body>
</html>
